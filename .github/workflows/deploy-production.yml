name: Deploy Production (Manual)

# Manual, gated production deployment orchestration via GitHub OIDC -> AWS
# SSM. Phase 3B-4 scope: this workflow validates and rehearses the ENTIRE
# pipeline (CI gate, change classification, artifact build/upload, SSM
# fetch/checksum/extract, release preparation, activation dry-run, rollback
# dry-run, health checks) but never performs a real activation, service
# restart, or migration. dry_run=true is enforced as a hard gate - real
# deployment (dry_run=false) is Phase 3B-5 and is intentionally not yet
# enabled by this workflow.
#
# workflow_dispatch only - never triggered by a PR, a fork, or a push. Every
# run is initiated manually by a repository collaborator with write access,
# operating on this repository's own ref - there is no untrusted-input
# surface for target_sha beyond what that collaborator explicitly typed.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full 40-character git SHA (must be an ancestor of main) to deploy'
        required: true
      confirm_production:
        description: 'Must equal DEPLOY exactly when dry_run=false (real deployment)'
        required: false
        default: ''
      dry_run:
        description: 'true = rehearse only (default, safe). false = real deployment; requires confirm_production=DEPLOY'
        required: true
        default: 'true'

permissions:
  contents: read      # checkout only
  id-token: write     # OIDC token for AWS role assumption
  actions: read       # CI gate: read workflow run status for the target SHA

concurrency:
  group: ptai-production-deploy
  cancel-in-progress: false   # never cancel an in-progress production deployment run

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::050916357757:role/PTAI-GitHub-Deploy-Role
  TARGET_INSTANCE_ID: i-068f92824b0375c5f
  ARTIFACT_BUCKET: ptai-deploy-artifacts-050916357757-use2
  STAGING_ROOT: /opt/ptai/staging

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # -----------------------------------------------------------------
      # Input validation - fail fast, before any AWS/EC2 contact.
      # -----------------------------------------------------------------
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          DRY_RUN="${{ inputs.dry_run }}"
          CONFIRM="${{ inputs.confirm_production }}"

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-character lowercase hex git SHA, got: $TARGET_SHA"
            exit 1
          fi

          if [ "$DRY_RUN" != "true" ] && [ "$DRY_RUN" != "false" ]; then
            echo "::error::dry_run must be exactly 'true' or 'false', got: $DRY_RUN"
            exit 1
          fi

          if [ -n "$CONFIRM" ] && [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::confirm_production must be exactly 'DEPLOY' or left empty, got: $CONFIRM"
            exit 1
          fi

          if [ "$DRY_RUN" = "false" ] && [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::Real deployment (dry_run=false) requires confirm_production=DEPLOY exactly - refusing to proceed without explicit confirmation."
            exit 1
          fi

          echo "Inputs validated: target_sha=$TARGET_SHA dry_run=$DRY_RUN"

      # -----------------------------------------------------------------
      # Checkout + target SHA ancestry validation.
      # -----------------------------------------------------------------
      - name: Checkout target SHA (full history for ancestry check)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify target SHA is a real commit and an ancestor of main
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::target_sha $TARGET_SHA is not an ancestor of main - refusing to deploy"
            exit 1
          fi
          ACTUAL_HEAD=$(git rev-parse HEAD)
          if [ "$ACTUAL_HEAD" != "$TARGET_SHA" ]; then
            echo "::error::checked-out HEAD ($ACTUAL_HEAD) does not match target_sha ($TARGET_SHA)"
            exit 1
          fi
          echo "Confirmed: $TARGET_SHA resolves to a real commit and is an ancestor of main"

      # -----------------------------------------------------------------
      # CI gate - never assume "on main" means "CI passed".
      # -----------------------------------------------------------------
      - name: CI gate - verify target SHA passed the CI workflow
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=completed" --jq '.workflow_runs')
          COUNT=$(echo "$RUNS_JSON" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No completed CI workflow run found for $TARGET_SHA - cannot verify CI passed"
            exit 1
          fi
          SUCCESS_COUNT=$(echo "$RUNS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "::error::CI did not succeed for $TARGET_SHA ($COUNT completed run(s) found, 0 successful)"
            exit 1
          fi
          echo "CI gate passed: $SUCCESS_COUNT successful CI run(s) found for $TARGET_SHA"

      # -----------------------------------------------------------------
      # AWS OIDC authentication - no long-lived credentials anywhere.
      # -----------------------------------------------------------------
      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ptai-deploy-production

      - name: Verify GitHub caller identity
        run: |
          set -euo pipefail
          IDENTITY=$(aws sts get-caller-identity --output json)
          ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')
          ARN=$(echo "$IDENTITY" | jq -r '.Arn')
          if [ "$ACCOUNT" != "050916357757" ]; then
            echo "::error::Unexpected AWS account: $ACCOUNT"
            exit 1
          fi
          case "$ARN" in
            *"PTAI-GitHub-Deploy-Role"*) ;;
            *) echo "::error::Unexpected assumed role ARN: $ARN"; exit 1 ;;
          esac
          echo "Confirmed GitHub caller identity: $ARN"

      # -----------------------------------------------------------------
      # Sync the control-plane deploy scripts (tooling, not release content)
      # to a fixed location on EC2, keyed to this exact checkout - this
      # keeps "the scripts that manage releases" conceptually and
      # physically separate from "the release content being deployed",
      # the same way uv/git are pre-installed tooling rather than part of
      # any one release.
      # -----------------------------------------------------------------
      - name: Sync deploy scripts to EC2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Only the scripts actually invoked ON the EC2 instance via SSM
          # need to be synced here (classify-changes.sh and build-artifact.sh
          # run locally on this runner instead, against the checked-out repo).
          # AWS SSM Run Command hard-caps total document+parameter size at
          # 97KB, and base64-embedding all of scripts/deploy/*.sh at once
          # (~200KB) blew past that limit on the first real dry-run attempt -
          # so this syncs only the required subset, split into small batches.
          SCRIPTS_TO_SYNC="fetch-artifact.sh prepare-release.sh activate-release.sh livekit-activity-gate.sh rollback-release.sh health-check.sh"
          REMOTE_DIR="/home/ubuntu/ptai-deploy-scripts"

          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command "mkdir -p $REMOTE_DIR" \
            > /tmp/sync_mkdir_result.txt
          cat /tmp/sync_mkdir_result.txt
          STATUS=$(grep '^status=' /tmp/sync_mkdir_result.txt | cut -d= -f2-)
          [ "$STATUS" = "Success" ] || { echo "::error::Failed to create $REMOTE_DIR on EC2 (status=$STATUS)"; exit 1; }

          BATCH_NUM=0
          BATCH=""
          BATCH_COUNT=0
          sync_batch() {
            [ -n "$BATCH" ] || return 0
            BATCH_NUM=$((BATCH_NUM + 1))
            printf '%s' "$BATCH" > "/tmp/sync_batch_${BATCH_NUM}_cmd.txt"
            bash scripts/deploy/ssm-run.sh \
              --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
              --timeout-seconds 60 --poll-interval-seconds 5 \
              --command-file "/tmp/sync_batch_${BATCH_NUM}_cmd.txt" \
              > "/tmp/sync_batch_${BATCH_NUM}_result.txt"
            cat "/tmp/sync_batch_${BATCH_NUM}_result.txt"
            local batch_status
            batch_status=$(grep '^status=' "/tmp/sync_batch_${BATCH_NUM}_result.txt" | cut -d= -f2-)
            [ "$batch_status" = "Success" ] || { echo "::error::Failed to sync deploy script batch $BATCH_NUM to EC2 (status=$batch_status)"; exit 1; }
          }

          for name in $SCRIPTS_TO_SYNC; do
            f="scripts/deploy/$name"
            [ -f "$f" ] || { echo "::error::required deploy script not found: $f"; exit 1; }
            b64=$(base64 -w0 "$f" 2>/dev/null || base64 "$f" | tr -d '\n')
            BATCH="${BATCH}echo ${b64} | base64 -d > ${REMOTE_DIR}/${name}"$'\n'
            BATCH_COUNT=$((BATCH_COUNT + 1))
            if [ "$BATCH_COUNT" -ge 2 ]; then
              sync_batch
              BATCH=""
              BATCH_COUNT=0
            fi
          done
          sync_batch

          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command "chmod +x ${REMOTE_DIR}/*.sh" \
            > /tmp/sync_chmod_result.txt
          cat /tmp/sync_chmod_result.txt
          STATUS=$(grep '^status=' /tmp/sync_chmod_result.txt | cut -d= -f2-)
          [ "$STATUS" = "Success" ] || { echo "::error::Failed to chmod synced deploy scripts on EC2 (status=$STATUS)"; exit 1; }
          echo "Deploy scripts synced to $REMOTE_DIR on EC2 ($BATCH_NUM batch(es))"

      # -----------------------------------------------------------------
      # Determine the currently-active release SHA on production, to use
      # as classify-changes.sh's comparison base.
      # -----------------------------------------------------------------
      - name: Determine current production release SHA
        id: current_release
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command 'basename "$(readlink -f /opt/ptai/current)"' \
            > /tmp/current_release_result.txt
          cat /tmp/current_release_result.txt
          STATUS=$(grep '^status=' /tmp/current_release_result.txt | cut -d= -f2-)
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Failed to determine current production release via SSM (status=$STATUS)"
            exit 1
          fi
          CURRENT_SHA=$(sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/current_release_result.txt | sed '1d;$d' | tr -d '[:space:]')
          if [[ ! "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Current production release SHA does not look like a valid git SHA: $CURRENT_SHA"
            exit 1
          fi
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "Current production release: $CURRENT_SHA"

      # -----------------------------------------------------------------
      # Change classification + hard gates.
      # -----------------------------------------------------------------
      - name: Classify changes
        id: classify
        run: |
          set -euo pipefail
          CURRENT_SHA="${{ steps.current_release.outputs.current_sha }}"
          TARGET_SHA="${{ inputs.target_sha }}"
          bash scripts/deploy/classify-changes.sh --base "$CURRENT_SHA" --target "$TARGET_SHA" --repo-path . > /tmp/classification.json
          cat /tmp/classification.json
          {
            echo "build_frontend=$(jq -r '.actions.build_frontend' /tmp/classification.json)"
            echo "restart_ptai=$(jq -r '.actions.restart_ptai' /tmp/classification.json)"
            echo "restart_livekit=$(jq -r '.actions.restart_livekit' /tmp/classification.json)"
            echo "venv_rebuild=$(jq -r '.actions.venv_rebuild' /tmp/classification.json)"
            echo "migration_gate=$(jq -r '.actions.migration_gate' /tmp/classification.json)"
            echo "nginx_gate=$(jq -r '.actions.nginx_gate' /tmp/classification.json)"
            echo "unknown_count=$(jq -r '.categories.UNKNOWN | length' /tmp/classification.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Hard gates - migration / infrastructure / unknown-unsafe changes STOP the workflow
        run: |
          set -euo pipefail
          BLOCKED=false
          if [ "${{ steps.classify.outputs.migration_gate }}" = "true" ]; then
            echo "::error::Database migration changes detected - Phase 3B-4 never deploys through this category automatically. STOP."
            BLOCKED=true
          fi
          if [ "${{ steps.classify.outputs.nginx_gate }}" = "true" ]; then
            echo "::error::Infrastructure (nginx) changes detected - requires a dedicated process, not this workflow. STOP."
            BLOCKED=true
          fi
          if [ "${{ steps.classify.outputs.unknown_count }}" != "0" ]; then
            echo "::error::Unclassified/unknown changes detected (conservative gate) - STOP rather than guess."
            BLOCKED=true
          fi
          if [ "$BLOCKED" = "true" ]; then
            exit 1
          fi
          echo "No hard-gate categories present - safe to continue with dry-run validation."

      # -----------------------------------------------------------------
      # Build the frontend unconditionally (simplicity/correctness over
      # skipping the build when classification says it's not needed -
      # prepare-release.sh always requires dist/ to exist).
      # -----------------------------------------------------------------
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # VITE_API_BASE_URL="" is deliberate, not an oversight: Vite inlines
      # import.meta.env.VITE_API_BASE_URL at build time, and src/services/
      # api.ts's `?? "http://localhost:8000"` fallback only fires for
      # null/undefined - an explicit empty string is NOT nullish, so it wins
      # over the dev-only fallback without touching that source file or
      # local development (which still gets the localhost fallback when this
      # var is simply unset, e.g. `npm run dev` outside CI). An empty base
      # makes every request same-origin-relative (`/api/auth/login`,
      # `/api/livekit/token`), which nginx already proxies correctly to
      # ptai.service - see docs/production-deployment-architecture.md. This
      # is what was missing: this build previously ran with no
      # VITE_API_BASE_URL at all, so the localhost fallback shipped straight
      # into the production bundle.
      - name: Build frontend
        timeout-minutes: 10
        env:
          VITE_API_BASE_URL: ""
        run: |
          set -euo pipefail
          npm ci
          npm run build

      # Fails loudly and immediately if the localhost fallback ever ends up
      # in a production bundle again (wrong env var name, a future
      # accidental unset, a build tool change) - catches the exact defect
      # this step exists to prevent, rather than letting it silently reach
      # production the way it did before.
      - name: Verify production build has no localhost fallback
        run: |
          set -euo pipefail
          if grep -r "localhost:8000" dist/assets/ 2>/dev/null; then
            echo "::error::Production build contains 'localhost:8000' - VITE_API_BASE_URL was not applied correctly. Refusing to package this build."
            exit 1
          fi
          echo "Confirmed: no 'localhost:8000' in dist/assets/"

      # -----------------------------------------------------------------
      # Build the deterministic release artifact and upload to S3.
      # -----------------------------------------------------------------
      - name: Build release artifact
        id: build_artifact
        timeout-minutes: 5
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          OUTPUT="/tmp/ptai-release.tar.gz"
          RESULT=$(bash scripts/deploy/build-artifact.sh --sha "$TARGET_SHA" --repo-path . --output "$OUTPUT")
          echo "$RESULT"
          SHA256=$(echo "$RESULT" | grep '^artifact_sha256=' | cut -d= -f2-)
          echo "artifact_path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to S3 (immutable SHA-keyed object)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          KEY="releases/${TARGET_SHA}/ptai-release.tar.gz"
          aws s3api put-object \
            --bucket "$ARTIFACT_BUCKET" \
            --key "$KEY" \
            --body "${{ steps.build_artifact.outputs.artifact_path }}" \
            --region "$AWS_REGION" \
            --output json
          echo "Uploaded to s3://$ARTIFACT_BUCKET/$KEY"

      # -----------------------------------------------------------------
      # EC2 fetch through SSM: verify identity, download, verify checksum,
      # safely extract.
      # -----------------------------------------------------------------
      - name: EC2 - verify instance-role caller identity
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command 'aws sts get-caller-identity --region us-east-2 --output json' \
            > /tmp/ec2_identity_result.txt
          cat /tmp/ec2_identity_result.txt
          STATUS=$(grep '^status=' /tmp/ec2_identity_result.txt | cut -d= -f2-)
          [ "$STATUS" = "Success" ] || { echo "::error::EC2 identity check failed (status=$STATUS)"; exit 1; }
          if ! sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/ec2_identity_result.txt | grep -q "PTAI-EC2-SSM-Role"; then
            echo "::error::EC2 caller identity did not match PTAI-EC2-SSM-Role"
            exit 1
          fi
          echo "Confirmed EC2 caller identity: PTAI-EC2-SSM-Role"

      - name: EC2 - fetch, verify checksum, safely extract artifact
        id: fetch
        timeout-minutes: 10
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          KEY="releases/${TARGET_SHA}/ptai-release.tar.gz"
          SHA256="${{ steps.build_artifact.outputs.artifact_sha256 }}"
          CMD="sudo mkdir -p $STAGING_ROOT && sudo chown ubuntu:ubuntu $STAGING_ROOT && bash /home/ubuntu/ptai-deploy-scripts/fetch-artifact.sh --bucket $ARTIFACT_BUCKET --key $KEY --expected-sha256 $SHA256 --staging-root $STAGING_ROOT --region us-east-2"
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 180 --poll-interval-seconds 5 \
            --command "$CMD" \
            > /tmp/fetch_result.txt
          cat /tmp/fetch_result.txt
          STATUS=$(grep '^status=' /tmp/fetch_result.txt | cut -d= -f2-)
          [ "$STATUS" = "Success" ] || { echo "::error::Artifact fetch/verify/extract failed on EC2 (status=$STATUS)"; exit 1; }
          STAGING_PATH=$(sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/fetch_result.txt | grep '^staging_path=' | cut -d= -f2-)
          [ -n "$STAGING_PATH" ] || { echo "::error::fetch-artifact.sh did not report a staging path"; exit 1; }
          echo "staging_path=$STAGING_PATH" >> "$GITHUB_OUTPUT"
          echo "Verified staging path on EC2: $STAGING_PATH"

      # -----------------------------------------------------------------
      # Prepare the release (never activates, never mutates 'current').
      # -----------------------------------------------------------------
      - name: EC2 - prepare release
        id: prepare
        timeout-minutes: 15
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          STAGING_PATH="${{ steps.fetch.outputs.staging_path }}"
          # SSM Run Command executes as root with $HOME unset, so uv (installed
          # for the ubuntu user under ~/.local/bin) is not on PATH by default -
          # prepare-release.sh requires uv to build the release venv.
          CMD="export PATH=/home/ubuntu/.local/bin:\$PATH; bash /home/ubuntu/ptai-deploy-scripts/prepare-release.sh --sha $TARGET_SHA --source-dir $STAGING_PATH"
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 300 --poll-interval-seconds 10 \
            --command "$CMD" \
            > /tmp/prepare_result.txt
          cat /tmp/prepare_result.txt
          STATUS=$(grep '^status=' /tmp/prepare_result.txt | cut -d= -f2-)
          if [ "$STATUS" != "Success" ]; then
            echo "::error::prepare-release.sh failed on EC2 (status=$STATUS) - current production remains untouched"
            exit 1
          fi
          echo "Release prepared successfully. current production is untouched."

      # -----------------------------------------------------------------
      # Activation. dry_run=true: --dry-run rehearsal only (unchanged from
      # Phase 3B-4). dry_run=false: the real, only-place-that-mutates-current
      # switch. activate-release.sh only ever exits non-zero BEFORE it writes
      # anything (all mutation happens after its last validation check), so
      # any non-zero exit here means current is still untouched.
      # -----------------------------------------------------------------
      - name: EC2 - activate release
        id: activate
        timeout-minutes: 3
        run: |
          set -euo pipefail
          TARGET_SHA="${{ inputs.target_sha }}"
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            CMD="bash /home/ubuntu/ptai-deploy-scripts/activate-release.sh --sha $TARGET_SHA --dry-run; echo ACTIVATE_EXIT=\$?"
          else
            CMD="bash /home/ubuntu/ptai-deploy-scripts/activate-release.sh --sha $TARGET_SHA; echo ACTIVATE_EXIT=\$?"
          fi
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command "$CMD" \
            > /tmp/activate_result.txt
          cat /tmp/activate_result.txt
          STATUS=$(grep '^status=' /tmp/activate_result.txt | cut -d= -f2-)
          [ "$STATUS" = "Success" ] || { echo "::error::SSM command to activate release failed outright (status=$STATUS) - current is untouched"; exit 1; }
          ACTIVATE_EXIT=$(sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/activate_result.txt | grep '^ACTIVATE_EXIT=' | tail -1 | cut -d= -f2-)
          if [ "$DRY_RUN" = "true" ]; then
            echo "activate-release.sh --dry-run exit code: $ACTIVATE_EXIT (informational only, current is untouched either way)"
          else
            if [ "$ACTIVATE_EXIT" = "3" ]; then
              echo "::error::activate-release.sh refused: unacknowledged migration file(s) detected on actual release content (exit 3). This should never happen given migration_gate=false from classification - STOPPING. current is untouched."
              exit 1
            elif [ "$ACTIVATE_EXIT" != "0" ]; then
              echo "::error::activate-release.sh failed (exit $ACTIVATE_EXIT). current is untouched (this is a pre-mutation failure by design)."
              exit 1
            fi
            echo "Activated: current -> release $TARGET_SHA"
          fi

      - name: EC2 - verify /opt/ptai/current matches expected post-activation state
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command 'basename "$(readlink -f /opt/ptai/current)"' \
            > /tmp/current_after_result.txt
          cat /tmp/current_after_result.txt
          AFTER_SHA=$(sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/current_after_result.txt | sed '1d;$d' | tr -d '[:space:]')
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            BEFORE_SHA="${{ steps.current_release.outputs.current_sha }}"
            if [ "$AFTER_SHA" != "$BEFORE_SHA" ]; then
              echo "::error::/opt/ptai/current CHANGED during a dry-run-only workflow: before=$BEFORE_SHA after=$AFTER_SHA"
              exit 1
            fi
            echo "Confirmed: /opt/ptai/current unchanged ($AFTER_SHA)"
          else
            TARGET_SHA="${{ inputs.target_sha }}"
            if [ "$AFTER_SHA" != "$TARGET_SHA" ]; then
              echo "::error::/opt/ptai/current does not point to target_sha after activation: expected=$TARGET_SHA actual=$AFTER_SHA"
              exit 1
            fi
            echo "Confirmed: /opt/ptai/current now points to $AFTER_SHA"
          fi

      # -----------------------------------------------------------------
      # LiveKit fresh-activity gate - runs immediately before any restart
      # decision below, always a fresh journalctl query (never cached).
      # Classification only here; the actual restart-or-skip decision is
      # made in the next step.
      # -----------------------------------------------------------------
      - name: EC2 - LiveKit fresh activity gate
        id: livekit_gate
        timeout-minutes: 3
        run: |
          set -euo pipefail
          CMD="bash /home/ubuntu/ptai-deploy-scripts/livekit-activity-gate.sh"
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command "$CMD" \
            > /tmp/livekit_gate_result.txt
          cat /tmp/livekit_gate_result.txt
          STATUS=$(grep '^status=' /tmp/livekit_gate_result.txt | cut -d= -f2-)
          [ "$STATUS" = "Success" ] || { echo "::error::LiveKit activity gate check failed (status=$STATUS)"; exit 1; }
          GATE_RESULT=$(sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/livekit_gate_result.txt | sed '1d;$d' | tr -d '[:space:]')
          echo "gate_result=$GATE_RESULT" >> "$GITHUB_OUTPUT"
          echo "LiveKit activity gate: $GATE_RESULT"

      # -----------------------------------------------------------------
      # Service restarts. dry_run=true: plan-only, unchanged from Phase
      # 3B-4. dry_run=false: real restarts, gated on the classifier output
      # AND the fresh LiveKit gate above - ACTIVE/AMBIGUOUS refuses to
      # restart livekit-agent and stops the whole run rather than leaving a
      # half-applied restart state (activation itself already succeeded and
      # is idempotent, so a re-run of this same target_sha is always safe
      # and cheap once the gate later reads IDLE).
      # -----------------------------------------------------------------
      - name: EC2 - restart services
        timeout-minutes: 3
        run: |
          set -euo pipefail
          DRY_RUN="${{ inputs.dry_run }}"
          RESTART_PTAI="${{ steps.classify.outputs.restart_ptai }}"
          RESTART_LIVEKIT="${{ steps.classify.outputs.restart_livekit }}"
          GATE="${{ steps.livekit_gate.outputs.gate_result }}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "restart_ptai would be required: $RESTART_PTAI"
            echo "restart_livekit would be required: $RESTART_LIVEKIT (LiveKit gate: $GATE)"
            echo "dry_run=true - no service is restarted."
            exit 0
          fi

          if [ "$RESTART_LIVEKIT" = "true" ] && [ "$GATE" != "IDLE" ]; then
            echo "::error::LiveKit activity gate is $GATE (not IDLE) and this deployment requires a livekit-agent restart. Refusing to restart ANY service. current already points to the new release (activation is idempotent - re-running this same deployment once the gate reads IDLE will simply skip straight to restarts). STOP AND REPORT."
            exit 1
          fi

          restart_and_verify() {
            local unit="$1"
            local cmd="systemctl restart $unit && sleep 3 && systemctl is-active $unit"
            bash scripts/deploy/ssm-run.sh \
              --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
              --timeout-seconds 60 --poll-interval-seconds 5 \
              --command "$cmd" \
              > "/tmp/restart_${unit}_result.txt"
            cat "/tmp/restart_${unit}_result.txt"
            local status
            status=$(grep '^status=' "/tmp/restart_${unit}_result.txt" | cut -d= -f2-)
            if [ "$status" != "Success" ] || ! sed -n '/---STDOUT---/,/---STDERR---/p' "/tmp/restart_${unit}_result.txt" | grep -q '^active$'; then
              echo "::error::Restart of $unit did not result in an active service (status=$status)"
              exit 1
            fi
            echo "$unit restarted and confirmed active."
          }

          if [ "$RESTART_PTAI" = "true" ]; then
            restart_and_verify ptai.service
          fi
          if [ "$RESTART_LIVEKIT" = "true" ]; then
            restart_and_verify ptai-livekit-agent.service
          fi
          echo "Restarts complete: ptai=$RESTART_PTAI livekit=$RESTART_LIVEKIT (gate was $GATE)"

      # -----------------------------------------------------------------
      # Rollback rehearsal. dry_run=true: unchanged --dry-run rehearsal.
      # dry_run=false: skipped here - a real rollback (if needed) is decided
      # AFTER the health checks below, from their result.
      # -----------------------------------------------------------------
      - name: EC2 - rollback-release.sh --dry-run
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "dry_run=false - skipping rollback rehearsal here; a real rollback is only invoked below if the post-deployment health check fails."
            exit 0
          fi
          CMD="bash /home/ubuntu/ptai-deploy-scripts/rollback-release.sh --dry-run; echo DRYRUN_EXIT=\$?"
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command "$CMD" \
            > /tmp/rollback_dryrun_result.txt
          cat /tmp/rollback_dryrun_result.txt
          echo "(rollback-release.sh exits non-zero when no rollback pointer exists yet - a correct, safe, expected outcome for an instance that has never been activated via these scripts; DRYRUN_EXIT is echoed explicitly above for visibility)"

      # -----------------------------------------------------------------
      # Health checks - read-only. Captures results as step outputs (rather
      # than failing immediately) so dry_run=false can act on them below.
      # -----------------------------------------------------------------
      - name: EC2 - local health check
        id: health_local
        timeout-minutes: 3
        run: |
          set -euo pipefail
          CMD="bash /home/ubuntu/ptai-deploy-scripts/health-check.sh --mode local; echo HEALTHCHECK_EXIT=\$?"
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command "$CMD" \
            > /tmp/healthcheck_result.txt
          cat /tmp/healthcheck_result.txt
          EXIT=$(sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/healthcheck_result.txt | grep '^HEALTHCHECK_EXIT=' | tail -1 | cut -d= -f2-)
          echo "exit_code=${EXIT:-2}" >> "$GITHUB_OUTPUT"

      - name: Public health check (from the runner)
        id: health_public
        timeout-minutes: 2
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -k "https://18.223.231.76/api/health")
          echo "Public health HTTP status: $CODE"
          echo "http_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ] && [ "$CODE" != "200" ]; then
            echo "::error::Public health check did not return 200 (got $CODE)"
            exit 1
          fi

      # -----------------------------------------------------------------
      # Post-deployment verification. dry_run=false only: if either health
      # check indicates trouble, roll back immediately using the
      # already-tested rollback path, restart services back, and re-verify
      # - exactly as instructed ("use the already-tested rollback path
      # immediately, unless a migration ran"). No migration ran in this
      # workflow at any point (the hard gate gates that before this line is
      # ever reached), so rollback is always safe to attempt here.
      # -----------------------------------------------------------------
      - name: EC2 - post-deployment verification (auto-rollback if unhealthy)
        if: ${{ inputs.dry_run == 'false' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          LOCAL_EXIT="${{ steps.health_local.outputs.exit_code }}"
          PUBLIC_CODE="${{ steps.health_public.outputs.http_code }}"
          if [ "$LOCAL_EXIT" = "0" ] && [ "$PUBLIC_CODE" = "200" ]; then
            echo "Post-deployment health OK (local exit=$LOCAL_EXIT, public=$PUBLIC_CODE). No rollback needed."
            exit 0
          fi

          echo "::error::Post-deployment health check failed (local health-check.sh exit=$LOCAL_EXIT, public HTTP=$PUBLIC_CODE). Rolling back immediately."

          CMD="bash /home/ubuntu/ptai-deploy-scripts/rollback-release.sh --confirm; echo ROLLBACK_EXIT=\$?"
          bash scripts/deploy/ssm-run.sh \
            --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout-seconds 60 --poll-interval-seconds 5 \
            --command "$CMD" \
            > /tmp/rollback_result.txt
          cat /tmp/rollback_result.txt
          ROLLBACK_STATUS=$(grep '^status=' /tmp/rollback_result.txt | cut -d= -f2-)
          ROLLBACK_EXIT=$(sed -n '/---STDOUT---/,/---STDERR---/p' /tmp/rollback_result.txt | grep '^ROLLBACK_EXIT=' | tail -1 | cut -d= -f2-)
          if [ "$ROLLBACK_STATUS" != "Success" ] || [ "$ROLLBACK_EXIT" != "0" ]; then
            echo "::error::ROLLBACK ITSELF FAILED (status=$ROLLBACK_STATUS exit=$ROLLBACK_EXIT). Manual intervention required immediately - current state is uncertain."
            exit 1
          fi
          echo "Rolled back: current -> previous release."

          restart_and_verify() {
            local unit="$1"
            local cmd="systemctl restart $unit && sleep 3 && systemctl is-active $unit"
            bash scripts/deploy/ssm-run.sh \
              --instance-id "$TARGET_INSTANCE_ID" --region "$AWS_REGION" \
              --timeout-seconds 60 --poll-interval-seconds 5 \
              --command "$cmd" \
              > "/tmp/rollback_restart_${unit}_result.txt"
            cat "/tmp/rollback_restart_${unit}_result.txt"
            local status
            status=$(grep '^status=' "/tmp/rollback_restart_${unit}_result.txt" | cut -d= -f2-)
            if [ "$status" != "Success" ] || ! sed -n '/---STDOUT---/,/---STDERR---/p' "/tmp/rollback_restart_${unit}_result.txt" | grep -q '^active$'; then
              echo "::error::Restart of $unit after rollback did not result in an active service (status=$status) - manual intervention required."
              exit 1
            fi
          }
          [ "${{ steps.classify.outputs.restart_ptai }}" = "true" ] && restart_and_verify ptai.service
          [ "${{ steps.classify.outputs.restart_livekit }}" = "true" ] && restart_and_verify ptai-livekit-agent.service

          RECHECK=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -k "https://18.223.231.76/api/health")
          echo "Post-rollback public health HTTP status: $RECHECK"
          if [ "$RECHECK" != "200" ]; then
            echo "::error::Health is STILL not OK after rollback (HTTP $RECHECK). Manual intervention required immediately."
            exit 1
          fi
          echo "Rollback complete and confirmed healthy. Failing this run so the failed deployment attempt is clearly visible."
          exit 1

      # -----------------------------------------------------------------
      # Final summary.
      # -----------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment run complete (dry_run=${{ inputs.dry_run }})"
            echo "- target_sha: ${{ inputs.target_sha }}"
            echo "- previous current_sha: ${{ steps.current_release.outputs.current_sha }}"
            echo "- artifact SHA-256: ${{ steps.build_artifact.outputs.artifact_sha256 }}"
            echo "- restart_ptai required: ${{ steps.classify.outputs.restart_ptai }}"
            echo "- restart_livekit required: ${{ steps.classify.outputs.restart_livekit }}"
            echo "- LiveKit activity gate: ${{ steps.livekit_gate.outputs.gate_result }}"
            echo "- local health exit: ${{ steps.health_local.outputs.exit_code }}"
            echo "- public health HTTP: ${{ steps.health_public.outputs.http_code }}"
          } >> "$GITHUB_STEP_SUMMARY"
